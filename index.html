<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: nutzt auf iPhones den ganzen Bildschirm (inkl. Notch-Bereich) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7f2">
  <title>Fan-Treff</title>
  <!-- Kleines Icon für den Browser-Tab (Akzentfarbe), direkt eingebettet -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ff5a36'/%3E%3C/svg%3E">
  <!-- Leaflet (Kartenbibliothek), feste Version 1.9.4. integrity prüft, dass die Datei unverändert ist -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Kopfzeile: großer Titel der aktuellen Ansicht, rechts die Stadt -->
  <header class="app-header">
    <h1 id="view-title">Karte</h1>
    <div class="header-actions">
      <span class="city-chip">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        Berlin
      </span>
      <!-- Profil-Button: zeigt Foto oder Initialen (js/app.js) -->
      <button id="profile-btn" class="avatar-btn" data-view="view-profile" aria-label="Profil"></button>
    </div>
  </header>

  <!-- Inhaltsbereich: genau eine Ansicht ist sichtbar, die anderen haben "hidden" -->
  <main class="app-main">
    <section id="view-map" class="view" data-title="Karte">
      <div id="map"></div>
      <!-- Kleine Legende über der Karte -->
      <div class="map-legend">
        <span><i class="legend-dot legend-fan"></i>Fankneipe</span>
        <span><i class="legend-dot legend-meetup"></i>Treffen geplant</span>
      </div>
    </section>

    <section id="view-meetups" class="view" data-title="Treffen" hidden>
      <!-- Filter nach Verein: waagerecht wischbare Chips, werden in js/app.js erzeugt -->
      <!-- Erinnerung an deine nächsten Treffen (js/app.js) -->
      <div id="reminder" class="reminder" hidden></div>
      <div id="club-filter" class="chip-row"></div>
      <ul id="meetup-list" class="meetup-list"></ul>
    </section>

    <section id="view-create" class="view" data-title="Neues Treffen" hidden>
      <!-- novalidate: Fehler zeigen wir selbst auf Deutsch an (js/app.js) -->
      <form id="create-form" class="form" novalidate>
        <label class="field">
          <span class="field-label">Spiel</span>
          <select name="match" required></select>
        </label>

        <label class="field">
          <span class="field-label">Kneipe</span>
          <select name="pub" required></select>
        </label>

        <label class="field">
          <span class="field-label">Treffpunkt-Uhrzeit</span>
          <input type="time" name="time" required>
          <span class="field-hint" id="time-hint"></span>
        </label>

        <label class="field">
          <span class="field-label">Plätze (inklusive dir)</span>
          <select name="spots">
            <option>2</option><option>3</option><option>4</option><option>5</option>
            <option selected>6</option><option>8</option><option>10</option><option>15</option>
          </select>
          <span class="field-hint">Kleine Gruppen sind persönlicher. Zusagen sind verbindlich, Absagen bis 3 Std. vorher.</span>
        </label>

        <label class="field">
          <span class="field-label">Dein Vorname</span>
          <input type="text" name="host" maxlength="30" autocomplete="given-name" required>
        </label>

        <label class="field">
          <span class="field-label">Kurze Nachricht <span class="optional">optional</span></span>
          <textarea name="note" rows="3" maxlength="140"
                    placeholder="z.B. Neu in Berlin, wer schaut mit?"></textarea>
        </label>

        <p id="form-error" class="form-error" role="alert"></p>
        <button type="submit" class="submit-btn">Treffen erstellen</button>
      </form>
    </section>
    <section id="view-profile" class="view" data-title="Profil" hidden>
      <form id="profile-form" class="form" novalidate>
        <div class="profile-photo-row">
          <div id="profile-photo-preview" class="avatar avatar-large"></div>
          <label class="secondary-btn photo-btn">
            Foto wählen
            <input type="file" name="photo" accept="image/*" hidden>
          </label>
        </div>

        <label class="field">
          <span class="field-label">Vorname</span>
          <input type="text" name="name" maxlength="30" autocomplete="given-name">
        </label>

        <label class="field">
          <span class="field-label">Lieblingsverein</span>
          <select name="club"></select>
        </label>

        <label class="field">
          <span class="field-label">Dein Bezirk</span>
          <select name="district"></select>
        </label>

        <fieldset class="field">
          <legend class="field-label">Sprachen</legend>
          <div class="toggle-row">
            <label class="toggle"><input type="checkbox" name="lang" value="de"><span>Deutsch</span></label>
            <label class="toggle"><input type="checkbox" name="lang" value="en"><span>English</span></label>
          </div>
        </fieldset>

        <p class="field-hint">Dein Profil wird nur in diesem Browser gespeichert (Demo, kein Konto).</p>
        <button type="submit" class="submit-btn">Speichern</button>
      </form>
    </section>
  </main>

  <!-- Untere Navigationsleiste: data-view verweist auf die id der Ansicht.
       "Neu" sitzt in der Mitte und ist als Hauptaktion hervorgehoben. -->
  <nav class="app-nav">
    <button class="nav-btn active" data-view="view-map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4zM9 4v13.5M15 6.5V20"/></svg>
      <span>Karte</span>
    </button>
    <button class="nav-btn nav-btn-main" data-view="view-create" aria-label="Neues Treffen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="nav-btn" data-view="view-meetups">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14a6.5 6.5 0 0 1 3 6"/></svg>
      <span>Treffen</span>
    </button>
  </nav>

  <!-- Detailansicht einer Kneipe: Bottom-Sheet, das von unten hereinfährt.
       Der Inhalt wird in js/app.js erzeugt. -->
  <div id="sheet-backdrop" class="sheet-backdrop"></div>
  <div id="pub-sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Kneipe">
    <div class="sheet-handle"></div>
    <button id="sheet-close" class="sheet-close" aria-label="Schließen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="pub-sheet-content" class="sheet-content"></div>
  </div>

  <!-- Simulierter Chat eines Treffens (Vollbild), Inhalt aus js/app.js -->
  <div id="chat" class="chat" role="dialog" aria-modal="true" aria-label="Chat">
    <header class="chat-header">
      <button id="chat-back" class="chat-back" aria-label="Zurück">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div>
        <p id="chat-title" class="chat-title"></p>
        <p id="chat-subtitle" class="muted"></p>
      </div>
    </header>
    <div id="chat-messages" class="chat-messages"></div>
    <form id="chat-form" class="chat-form">
      <input name="text" type="text" maxlength="300" placeholder="Nachricht schreiben" autocomplete="off">
      <button type="submit" aria-label="Senden">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2-6-8-2z"/></svg>
      </button>
    </form>
  </div>

  <!-- Bestätigung vor der verbindlichen Zusage -->
  <dialog id="confirm-dialog" class="dialog">
    <h2>Verbindlich zusagen?</h2>
    <p id="confirm-text"></p>
    <div class="dialog-actions">
      <button id="confirm-no" class="secondary-btn">Abbrechen</button>
      <button id="confirm-yes" class="submit-btn">Zusagen</button>
    </div>
  </dialog>

  <!-- Kurze Bestätigung, z.B. "Treffen erstellt" -->
  <div id="toast" class="toast" role="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
